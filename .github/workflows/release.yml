name: release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  APT_DEPS: >-
    build-essential pkg-config
    libwayland-dev libwayland-bin
    libcairo2-dev libxkbcommon-dev libmagic-dev
    libcurl4-openssl-dev libjson-c-dev libdbus-1-dev
  FULL_DEPS: libjpeg-dev libwebp-dev libpipewire-0.3-dev

jobs:
  package-linux-x86_64:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - image: debian:bookworm-slim
            prefix: grabit
            hdr: ''
          - image: debian:trixie-slim
            prefix: grabit-hdr
            hdr: '1'
    steps:
      - name: install deps
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates git $APT_DEPS $FULL_DEPS
      - uses: actions/checkout@v6
      - name: build stripped releases
        env:
          VERSION: ${{ github.ref_name }}
          PREFIX: ${{ matrix.prefix }}
          HDR: ${{ matrix.hdr }}
        run: |
          set -eu
          make -j"$(nproc)" release-bin OUT="$PREFIX-x86_64-linux" VERSION="$VERSION" \
            HAVE_PNG_HDR="$HDR" HAVE_JPEG= HAVE_WEBP= HAVE_PIPEWIRE=
          make -j"$(nproc)" release-bin OUT="$PREFIX-full-x86_64-linux" VERSION="$VERSION" \
            HAVE_PNG_HDR="$HDR" HAVE_JPEG=1 HAVE_WEBP=1 HAVE_PIPEWIRE=1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.prefix }}-x86_64-linux
          path: |
            ${{ matrix.prefix }}-x86_64-linux
            ${{ matrix.prefix }}-x86_64-linux.sha256
            ${{ matrix.prefix }}-full-x86_64-linux
            ${{ matrix.prefix }}-full-x86_64-linux.sha256
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [package-linux-x86_64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: grabit*-x86_64-linux
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            grabit-x86_64-linux
            grabit-x86_64-linux.sha256
            grabit-full-x86_64-linux
            grabit-full-x86_64-linux.sha256
            grabit-hdr-x86_64-linux
            grabit-hdr-x86_64-linux.sha256
            grabit-hdr-full-x86_64-linux
            grabit-hdr-full-x86_64-linux.sha256
