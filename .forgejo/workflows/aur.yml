name: aur

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'version to publish (defaults to the latest tag)'
        required: false

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: install deps
        run: pacman -Syu --noconfirm --needed git pacman-contrib openssh

      - name: resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "refusing to publish version '$version': expected digits and dots only" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing $version"

      - name: configure ssh
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set; add it to the repository secrets" >&2
            exit 1
          fi
          useradd -m builder
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          cat > /home/builder/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            AddressFamily inet
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chown -R builder:builder /home/builder/.ssh
          chmod 600 /home/builder/.ssh/aur /home/builder/.ssh/config /home/builder/.ssh/known_hosts
          su - builder -c 'git config --global user.name "creations"'
          su - builder -c 'git config --global user.email "creations@creations.works"'
          ok=
          for i in 1 2 3 4 5; do
            if timeout 60 su - builder -c 'ssh aur@aur.archlinux.org list-repos' < /dev/null; then
              ok=1
              break
            fi
            echo "aur ssh attempt $i failed" >&2
            if [ "$i" -lt 5 ]; then sleep $((i * 20)); fi
          done
          if [ -z "$ok" ]; then
            echo "cannot reach aur.archlinux.org:22 after 5 attempts" >&2
            exit 1
          fi

      - name: publish grabit
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          su - builder -c '
            set -euo pipefail
            rm -rf ~/grabit
            for i in 1 2 3; do
              git clone --quiet ssh://aur@aur.archlinux.org/grabit.git ~/grabit && break
              if [ "$i" = 3 ]; then exit 1; fi
              sleep $((i * 20))
            done
            cd ~/grabit
            sed -i "s/^pkgver=.*/pkgver='"$VERSION"'/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            makepkg --printsrcinfo > .SRCINFO
            grep -E "^(pkgver|pkgrel)=" PKGBUILD
            if git diff --quiet; then
              echo "no change, skipping"
            else
              git add PKGBUILD .SRCINFO
              git commit -q -m '"$VERSION"'
              for i in 1 2 3; do
                git push origin HEAD:master && break
                if [ "$i" = 3 ]; then exit 1; fi
                sleep $((i * 20))
              done
            fi
          '
