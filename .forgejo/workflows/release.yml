name: release

on:
  push:
    tags: ['[0-9]*']

env:
  DEBIAN_FRONTEND: noninteractive
  APT_DEPS: >-
    build-essential pkg-config
    libwayland-dev libwayland-bin
    libcairo2-dev libxkbcommon-dev libmagic-dev
    libcurl4-openssl-dev libjson-c-dev libdbus-1-dev
  FULL_DEPS: libjpeg-dev libwebp-dev libpipewire-0.3-dev

jobs:
  create-release:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: install deps
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates jq curl
      - name: create draft release
        id: create
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"$TAG\",\"draft\":true}" \
            "$SERVER/api/v1/repos/$REPO/releases")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r .id)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "release create failed: $RESPONSE" >&2
            exit 1
          fi
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  package-linux-x86_64:
    runs-on: ubuntu-latest
    needs: [create-release]
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - image: debian:bookworm-slim
            prefix: grabit
            hdr: ''
          - image: debian:trixie-slim
            prefix: grabit-hdr
            hdr: '1'
    steps:
      - name: install deps
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates git nodejs curl $APT_DEPS $FULL_DEPS
      - uses: actions/checkout@v4
      - name: build stripped releases
        env:
          VERSION: ${{ github.ref_name }}
          PREFIX: ${{ matrix.prefix }}
          HDR: ${{ matrix.hdr }}
        run: |
          set -eu
          make -j"$(nproc)" release-bin OUT="$PREFIX-x86_64-linux" VERSION="$VERSION" \
            HAVE_PNG_HDR="$HDR" HAVE_JPEG= HAVE_WEBP= HAVE_PIPEWIRE=
          make -j"$(nproc)" release-bin OUT="$PREFIX-full-x86_64-linux" VERSION="$VERSION" \
            HAVE_PNG_HDR="$HDR" HAVE_JPEG=1 HAVE_WEBP=1 HAVE_PIPEWIRE=1
      - name: upload assets
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          set -eu
          for f in "$PREFIX-x86_64-linux" "$PREFIX-x86_64-linux.sha256" \
                   "$PREFIX-full-x86_64-linux" "$PREFIX-full-x86_64-linux.sha256"; do
            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" \
              "$SERVER/api/v1/repos/$REPO/releases/$RELEASE_ID/assets?name=$f"
          done
