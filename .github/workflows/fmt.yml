name: fmt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fmt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: install deps
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends git make clang-format
      - uses: actions/checkout@v6
      - run: make fmt-check
